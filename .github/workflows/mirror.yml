name: check-console

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check candidate tags
        run: |
          for repo in kubesphereio/ks-console kubespheredev/ks-console kubesphereon/ks-console; do
            echo "===== $repo ====="
            curl -s "https://hub.docker.com/v2/repositories/$repo/tags/?page_size=100" | python3 -c "import sys,json; d=json.load(sys.stdin); print('\n'.join(t['name'] for t in d.get('results',[])))" || true
          done
