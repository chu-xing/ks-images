name: mirror-console

on:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Mirror console to GHCR
        run: |
          set -e
          owner=${{ github.repository_owner }}
          docker pull kubesphereon/ks-console:v4.1.3
          docker tag kubesphereon/ks-console:v4.1.3 ghcr.io/$owner/kubesphereon/ks-console:v4.1.3
          docker push ghcr.io/$owner/kubesphereon/ks-console:v4.1.3
