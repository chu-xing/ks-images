name: find-console

on:
  workflow_dispatch:

jobs:
  search:
    runs-on: ubuntu-latest
    steps:
      - name: Search console images
        run: |
          echo "===== search ks-console ====="
          docker search ks-console || true
          echo "===== search kubesphere (console) ====="
          docker search kubesphere --limit 100 | grep -i console || true
          echo "===== search kubesphereio (console) ====="
          docker search kubesphereio --limit 100 | grep -i console || true
